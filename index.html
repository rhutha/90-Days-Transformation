<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transform">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>90-Day Transformation</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaef;--mut:#9aa1ad;--acc:#ff7a1a;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header .sub{color:var(--mut);font-size:13px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(20,22,28,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.card h3{margin:12px 0 6px;font-size:15px;color:var(--acc)}
.mut{color:var(--mut)}.sm{font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;margin:2px 4px 2px 0}
.pill.a{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button,.seg button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chips button.on,.seg button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
ul.ex{list-style:none;margin:0;padding:0}
ul.ex li{border-top:1px solid var(--line);padding:9px 0}
ul.ex li:first-child{border-top:0}
.exr{display:flex;align-items:center;gap:10px}
.exr label{flex:1;display:flex;gap:10px;align-items:center}
.exr .nm{flex:1}
.rx{color:var(--acc);font-weight:600;font-size:13px;text-align:right;max-width:46%}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.ib{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:50%;width:26px;height:26px;font-size:13px;flex:none}
.cue{display:none;margin:8px 0 0 32px;font-size:13px;color:var(--mut)}
.cue.show{display:block}
.cue a{color:var(--acc);text-decoration:none;font-weight:600}
.blk{margin-top:10px}
.blk>.bh{font-weight:700;font-size:14px;display:flex;justify-content:space-between;color:var(--tx);margin-bottom:2px}
.note{background:#2a1f12;border:1px solid #5a3a14;color:#ffd7b0;border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0}
.okn{background:#0f2418;border:1px solid #1d5232;color:#b9f5cf;border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0}
.big{width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-weight:700;background:var(--acc);color:#111;margin-top:10px}
.big.done{background:var(--ok)}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px}
.meal{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .t{color:var(--acc);font-weight:700;font-size:13px}
.meal b{display:block;font-size:14px}
.meal .d{font-size:13.5px;color:#cfd3da}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
input[type=number],input[type=date],input[type=text],textarea{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px;font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.cal .d1{background:var(--ok);color:#06210f;font-weight:700}
.cal .td{outline:2px solid var(--acc)}
.cal .ms{background:#3a1d1d}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
details{border-top:1px solid var(--line);padding:9px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer}
details p,details li{font-size:13.5px;color:#cfd3da}
ol,ul.b{padding-left:20px;margin:6px 0}
.hide{display:none}
</style>
</head>
<body>
<header><h1 id="ttl">90-Day Transformation</h1><div class="sub" id="hsub"></div></header>
<main>
  <section id="v-today"></section>
  <section id="v-train" class="hide"></section>
  <section id="v-diet" class="hide"></section>
  <section id="v-posture" class="hide"></section>
  <section id="v-glow" class="hide"></section>
  <section id="v-plan" class="hide"></section>
</main>
<nav id="nav">
  <button data-v="today" class="on"><span>🏠</span>Today</button>
  <button data-v="train"><span>🏋️</span>Train</button>

  <button data-v="posture"><span>🧍</span>Posture</button>
  <button data-v="glow"><span>✨</span>Glow</button>
  <button data-v="plan"><span>📈</span>Track</button>
</nav>

<script>

 const P={t:"Daily Posture Fix (10–12 min)",f:"Rounded shoulders · Forward head · Tight hips · Weak glutes",m:12,b:[
  {h:"Release",x:[e("thor","2 min (3 spots)"),e("pecst","45s/side"),e("hipflex","45s/side")]},
  {h:"Activate",x:[e("chin","2×10 · 3s hold"),e("wangel","2×10"),e("pullap","2×20"),e("ytw","1×8 each"),e("glbr","2×15"),e("dbug","2×8/side")]},
  {h:"Lock it in",x:[e("wallchk","60s")]}]};
 const t=ymd(new Date());
 let h=`<div class="card"><h2>${P.t}</h2>${session(P,0,null)}<div class="okn">Do this every day — morning or after work. Tick "Posture routine" in Today's habits.</div></div>`;
 h+=`<div class="card"><h2>Work-from-home setup (most important)</h2><ul class="b sm">
 <li><b>Screen top at eye level</b>, arm's length away. Laptop? Use a stand + external keyboard & mouse (₹1,500 total). This alone fixes half your neck problem.</li>
 <li>Chair: feet flat, knees ~90°, lower back supported (rolled towel), elbows at 90° by your sides.</li>
 <li><b>Phone at eye level</b> — lift the phone, don't drop the head. Every inch forward adds ~4–5 kg load on the neck.</li>
 <li><b>45/5 rule:</b> every 45 min stand 5 min: 10 chin tucks, 10 shoulder-blade squeezes, 10 bodyweight squats, door chest stretch.</li>
 <li>Take calls standing or on the walking pad (2.5–3.5 km/h). Aim 4,000–6,000 steps during work hours.</li>
 <li>Set an hourly reminder on iPhone (Clock → Alarm, or Reminders "every hour 10–6").</li></ul></div>`;
 h+=`<div class="card"><h2>Sleep posture</h2><ul class="b sm"><li>Sleep on back or side; avoid stomach sleeping (twists the neck).</li><li>Pillow height so the neck stays level with the spine. Side sleepers: pillow between knees.</li></ul></div>
 <div class="card"><h2>Standing cues (all day)</h2><p class="sm">"Tall crown, chin back, ribs down, shoulders back & down (not forced), glutes lightly on, weight mid-foot." Check yourself in every mirror you pass.</p>
 <p class="sm mut">Result timeline: you'll feel straighter in 2 weeks; visible change in photos by week 6–8, if you also fix the desk setup.</p></div>`;
 document.getElementById("v-posture").innerHTML=h;
}

/* ================= GLOW: SKIN / HAIR / AYURVEDA ================= */
function renderGlow(){
 document.getElementById("v-glow").innerHTML=`
 <div class="card"><h2>Face glow — daily routine</h2>
 <h3>☀️ Morning (3 min)</h3><ol class="sm"><li>Gentle face wash (e.g. Cetaphil / Simple / Minimalist).</li><li><b>Vitamin C serum</b> (10–15%) or <b>Niacinamide 10%</b> — dullness, dark spots, oil control.</li><li>Light gel moisturiser.</li><li><b>Sunscreen SPF 50 PA+++</b> — EVERY day, even WFH (window UV). #1 anti-ageing step. Reapply if you go out.</li></ol>
 <h3>🌙 Night (3 min)</h3><ol class="sm"><li>Wash face (twice if you wore sunscreen outside).</li><li>Weeks 1–2: niacinamide. <b>From week 3: Retinol 0.25–0.3%</b> (pea-size) 2 nights/week → 3 → every other night. Reduces fine lines, pores, dullness. Never with vit-C/AHA same night.</li><li>Moisturiser (ceramide-based). Lip balm.</li></ol>
 <h3>🗓️ Weekly</h3><ul class="b sm"><li>1× <b>salicylic acid (BHA)</b> face wash/exfoliant — clears pores, pollution grime.</li><li>1× <b>ubtan</b>: 2 tsp besan + pinch haldi + 1 tsp curd + few drops honey/rose water. 10 min, wash off. Brightens.</li><li>Fresh aloe vera gel at night on non-retinol nights — soothing.</li></ul>
 <div class="note">Patch-test new products on the jaw for 2 days. Persistent pigmentation, acne or dark circles → dermatologist.</div></div>

 <div class="card"><h2>Glow from inside</h2><ul class="b sm"><li><b>Sleep 7–8 h</b> — dull skin & dark circles are mostly sleep + screen time.</li><li><b>3.5 L water</b>, 5 colours of veggies/fruit daily (beetroot, carrot, spinach, tomato, papaya).</li><li>Cut sugar → less glycation (sugar ages skin) and less inflammation.</li><li>Amla, guava, orange = vitamin C for collagen. Walnuts, flax = omega-3.</li><li>Sweat 6 days/week → better circulation and that 'athlete' flush.</li></ul></div>

 <div class="card"><h2>Hair (thinning) & beard (white)</h2>
 <details open><summary>Honest truth first</summary><p>Grey/white hair is mostly <b>genetic</b>; it usually can't be reversed. But deficiencies (B12, vitamin D, iron/ferritin, copper, thyroid) and stress can speed it up — fixing them can slow it, and occasionally a few hairs re-pigment. Thinning hair in men is usually androgenic and <b>progressive</b> — start early to keep what you have.</p></details>
 <details><summary>Medical options (most effective)</summary><ul class="b"><li>See a <b>dermatologist</b> about <b>Minoxidil 5%</b> and/or oral options — these are the evidence-based treatments for thinning.</li><li><b>Ketoconazole 2% shampoo</b> 2×/week if dandruff/itchy scalp.</li><li>Get blood tests (see Track tab) — correct B12, D3, ferritin, thyroid.</li></ul></details>
 <details><summary>Ayurveda / home care</summary><ul class="b"><li>Oil massage 2×/week, 1 h before wash: coconut oil heated with <b>curry leaves + methi seeds</b>, or <b>bhringraj / amla oil</b>. 5 min scalp massage boosts circulation.</li><li>Daily: 1 amla (or 20 ml juice) + 8–10 curry leaves (chew or in food).</li><li>Shampoo with lukewarm (not hot) water. Avoid tight caps and harsh styling.</li><li>Protein 120 g+/day — hair is made of protein.</li></ul></details>
 <details><summary>Beard styling for a younger look</summary><ul class="b"><li><b>Option A — own it:</b> a short, sharply shaped salt-and-pepper beard (3–6 mm, clean cheek & neck line) looks premium and mature-fit. Get it shaped by a good barber every 2–3 weeks.</li><li><b>Option B — colour:</b> ammonia-free beard colour, or natural henna + indigo (2-step) for darker tone. Patch test first.</li><li>Beard oil daily, trim weekly. A visible jawline (from fat loss) makes the biggest age difference.</li></ul></details></div>

 <div class="card"><h2>Ayurveda daily ritual (Dinacharya)</h2><table>
 <tr><td><b>Wake</b></td><td>Tongue scraping, oil pulling 5 min (1 tbsp coconut/sesame oil), warm water.</td></tr>
 <tr><td><b>Morning drink</b></td><td>Alternate: soaked methi water (blood sugar) · jeera-ajwain-saunf water (bloating) · cinnamon + lemon warm water.</td></tr>
 <tr><td><b>Daily</b></td><td>Amla, curry leaves, haldi + kali mirch in food, ginger.</td></tr>
 <tr><td><b>After meals</b></td><td>½ tsp saunf + 10 min walk.</td></tr>
 <tr><td><b>Night</b></td><td>Haldi doodh (no sugar). Optional Triphala 1 tsp in warm water (digestion).</td></tr>
 <tr><td><b>Weekly</b></td><td>Abhyanga: full body warm sesame-oil massage before Sunday bath.</td></tr></table>
 <div class="note">Ayurveda helps digestion, stress and sleep — but fat loss & muscle come from calories, protein, training and sleep. Avoid "fat-burner" churans and "hair regrowth" miracle products.</div></div>`;
}

/* ================= TRACK / PLAN ================= */
function renderPlan(){
 const now=new Date(),n=dayNum(now),t=ymd(now);
 let cal="";for(let i=1;i<=84;i++){const d=new Date(pd(S.start));d.setDate(d.getDate()+i-1);const k=ymd(d);const dn=getk(k,"W");const past=i<n;const isRest=d.getDay()===0;cal+=`<div class="${dn?"d1":(past&&!isRest?"ms":"")} ${i===n?"td":""}" title="${k}">${i}</div>`}
 const doneCount=Object.keys(S.done).filter(k=>S.done[k].W).length;
 let streak=0;{const d=new Date();if(!getk(ymd(d),"W"))d.setDate(d.getDate()-1);while(pd(ymd(d))>=pd(S.start)){if(getk(ymd(d),"W"))streak++;else if(d.getDay()!==0)break;d.setDate(d.getDate()-1)}}
 const L=[...S.logs].sort((a,b)=>a.d<b.d?-1:1);const f=L[0],l=L[L.length-1];
 let h=`<div class="card"><h2>Program</h2><label class="sm mut">Start date (Day 1)</label><input type="date" id="startD" value="${S.start}">
 <div class="row" style="margin-top:10px"><span class="pill a">Workouts done: ${doneCount}</span><span class="pill">🔥 Streak: ${streak}</span><span class="pill">Day ${Math.max(0,Math.min(84,n))}/84</span></div>
 <div class="bar"><i style="width:${Math.max(0,Math.min(100,n/84*100))}%"></i></div>
 <h3>12-week calendar</h3><div class="cal">${cal}</div><p class="sm mut">Green = workout done · red = missed · orange ring = today.</p></div>`;
 h+=`<div class="card"><h2>Log measurements</h2><div class="grid2"><div><label class="sm mut">Date</label><input type="date" id="lgD" value="${t}"></div><div><label class="sm mut">Weight (kg)</label><input type="number" step="0.1" id="lgW" inputmode="decimal"></div><div><label class="sm mut">Waist at navel (cm)</label><input type="number" step="0.5" id="lgWa" inputmode="decimal"></div><div><label class="sm mut">Chest / Arm (cm)</label><input type="text" id="lgC" placeholder="e.g. 100 / 33"></div></div>
 <label class="sm mut">Notes (energy, sleep, strength PRs)</label><textarea id="lgN" rows="2"></textarea><button class="big" id="lgSave">Save entry</button>
 ${L.length>1?`<div class="okn">Since ${f.d}: weight ${(l.w-f.w>0?"+":"")+(l.w-f.w).toFixed(1)} kg${f.wa&&l.wa?` · waist ${(l.wa-f.wa>0?"+":"")+(l.wa-f.wa).toFixed(1)} cm`:""}</div>`:""}
 <table style="margin-top:8px"><tr><th>Date</th><th>Kg</th><th>Waist</th><th>Chest/Arm</th><th></th></tr>${L.slice().reverse().map(x=>`<tr><td>${x.d}</td><td>${x.w||""}</td><td>${x.wa||""}</td><td>${esc(x.c||"")}</td><td><button class="ib" data-del="${x.d}">×</button></td></tr>${x.n?`<tr><td colspan="5" class="mut sm">${esc(x.n)}</td></tr>`:""}`).join("")}</table></div>`;
 h+=`<div class="card"><h2>Realistic 12-week expectations</h2><ul class="b sm">
 <li><b>Weight:</b> 86 → ~77–80 kg (fat loss 7–10 kg while adding some muscle).</li>
 <li><b>Waist:</b> −8 to −12 cm. Belly, back fat and thighs shrink noticeably; clothes fit very differently.</li>
 <li><b>Abs:</b> a full, sharp six-pack needs ~10–12% body fat. You're likely ~28–30% now. In 12 weeks expect a flatter stomach and an <b>upper-ab outline</b> in good light. Full six-pack, veins and deep cuts = continue this plan for another 3–6 months. That's normal — even celebrity transformations take 6–12 months.</li>
 <li><b>Posture:</b> visibly taller & more open chest by week 6–8.</li>
 <li><b>Stamina:</b> HIIT rounds & walks will feel easy by week 6.</li>
 <li><b>Face:</b> fat loss + sleep + SPF/retinol = sharper jawline, less puffiness, clearer skin in 6–8 weeks. You won't reverse your age — but you will look 5+ years younger than you do today.</li></ul></div>`;
 h+=`<div class="card"><h2>Before you start (Week 0)</h2><ul class="b sm">
 <li><b>Blood tests</b> (one package at Thyrocare / Lal PathLabs / Redcliffe ~₹1,500–3,000): CBC, Lipid profile, HbA1c + fasting sugar, Thyroid (TSH, T3, T4), Vitamin D, Vitamin B12, Ferritin/Iron, Liver & Kidney function, Uric acid. Optional: Total testosterone.</li>
 <li>See a doctor before HIIT if you have BP, heart, knee or back issues.</li>
 <li>Take 'before' photos (front/side/back) and measurements. Log them here.</li>
 <li>Buy: kitchen scale, laptop stand, doorway pull-up bar, SPF 50, whey, creatine.</li>
 <li>Repeat blood tests at week 12 — they'll show the inside transformation.</li></ul></div>`;
 h+=`<div class="card"><h2>Backup</h2><p class="sm mut">Data lives only on this device/browser. Export weekly.</p><div class="row"><button class="btn" id="exp">⬇ Export</button><label class="btn">⬆ Import<input type="file" id="imp" accept=".json" class="hide"></label><button class="btn" id="rst" style="color:var(--bad)">Reset all</button></div></div>`;
 document.getElementById("v-plan").innerHTML=h;
}

/* ================= EVENTS ================= */
const R={today:renderToday,train:renderTrain,diet:renderDiet,posture:renderPosture,glow:renderGlow,plan:renderPlan};
let cur="today";
function show(v){cur=v;document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("hide",s.id!=="v-"+v));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));R[v]();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",ev=>{const b=ev.target.closest("button");if(b)show(b.dataset.v)});
document.addEventListener("change",ev=>{const x=ev.target;
 if(x.dataset.k){setk(x.dataset.d,x.dataset.k,x.checked);if(x.dataset.k.startsWith("h-"))renderToday();return}
 if(x.id==="startD"&&x.value){S.start=x.value;save();renderPlan();renderToday()}
 if(x.id==="imp"&&x.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.start&&o.done){S=o;save();show(cur);alert("Imported ✔")}}catch(_){alert("Invalid file")}};r.readAsText(x.files[0])}
});
document.addEventListener("click",ev=>{const x=ev.target.closest("button");if(!x||x.closest("nav"))return;const ds=x.dataset;
 if("cue" in ds){x.closest("li").querySelector(".cue").classList.toggle("show")}
 else if(ds.mode){S.mode=ds.mode;save();renderToday()}
 else if(ds.wd){setk(ds.wd,"W",!getk(ds.wd,"W"));renderToday()}
 else if(ds.tm){tr.mode=ds.tm;renderTrain()}else if(ds.tp){tr.ph=+ds.tp;renderTrain()}else if(ds.td){tr.dow=+ds.td;renderTrain()}
 else if(ds.dd){dd=+ds.dd;renderDiet()}
 else if(ds.del){if(confirm("Delete entry "+ds.del+"?")){S.logs=S.logs.filter(l=>l.d!==ds.del);save();renderPlan()}}
 else if(x.id==="lgSave"){const d=document.getElementById("lgD").value,w=parseFloat(document.getElementById("lgW").value),wa=parseFloat(document.getElementById("lgWa").value);if(!d||(!w&&!wa)){alert("Enter weight or waist");return}
  S.logs=S.logs.filter(l=>l.d!==d);S.logs.push({d,w:w||null,wa:wa||null,c:document.getElementById("lgC").value,n:document.getElementById("lgN").value});save();renderPlan()}
 else if(x.id==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="transform-backup-"+ymd(new Date())+".json";a.click()}
 else if(x.id==="rst"){if(confirm("Erase ALL progress, logs and settings?")){localStorage.removeItem("tx");location.reload()}}
});
show("today");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
